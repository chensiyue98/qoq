name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build QoQ
    runs-on: macos-26
    timeout-minutes: 20

    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Verify shared scheme
        run: |
          test -f qoq.xcodeproj/xcshareddata/xcschemes/QoQ.xcscheme
          xcodebuild -list -project qoq.xcodeproj

      - name: Build application
        run: |
          xcodebuild \
            build \
            -project qoq.xcodeproj \
            -scheme QoQ \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO