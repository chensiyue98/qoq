name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.2.0"
        required: true
        type: string
      build_number:
        description: "Build number, for example 12"
        required: true
        type: string
      prerelease:
        description: "Create a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  app_store:
    name: Upload to App Store Connect
    if: ${{ inputs.prerelease == false }}
    runs-on: macos-26
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      PROJECT: qoq.xcodeproj
      SCHEME: QoQ-AppStore
      TEAM_ID: 4SGGP72YQZ

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid build number: $BUILD_NUMBER"
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Releases must be created from main"
            exit 1
          fi

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Create temporary keychain
        shell: bash
        env:
          DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPMENT_P12_BASE64 }}
          DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          DEVELOPMENT_CERTIFICATE_PATH="$RUNNER_TEMP/apple-development.p12"
          DISTRIBUTION_CERTIFICATE_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/qoq-app-store.keychain-db"

          printf '%s' "$DEVELOPMENT_CERTIFICATE_BASE64" |
            base64 --decode > "$DEVELOPMENT_CERTIFICATE_PATH"

          printf '%s' "$DISTRIBUTION_CERTIFICATE_BASE64" |
            base64 --decode > "$DISTRIBUTION_CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$DEVELOPMENT_CERTIFICATE_PATH" \
            -P "$DEVELOPMENT_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security import "$DISTRIBUTION_CERTIFICATE_PATH" \
            -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.ASC_KEY_ID }}.p8"

          printf '%s' "$ASC_PRIVATE_KEY_BASE64" |
            base64 --decode > "$ASC_KEY_PATH"

          chmod 600 "$ASC_KEY_PATH"
          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive App Store application
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/QoQ-AppStore.xcarchive"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release-AppStore \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            ENABLE_APP_SANDBOX=YES \
            ENABLE_HARDENED_RUNTIME=YES \
            ONLY_ACTIVE_ARCH=NO

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Upload App Store build
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$RUNNER_TEMP/AppStoreExport" \
            -exportOptionsPlist "Config/ExportOptions-AppStore.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload diagnostic artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-diagnostics
          path: |
            ~/Library/Logs/DiagnosticReports
            ${{ runner.temp }}/*.xcdistributionlogs
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

  release:
    name: Build, notarize and release
    needs: app_store
    if: ${{ always() && (inputs.prerelease == true || needs.app_store.result == 'success') }}
    runs-on: macos-26
    environment: production
    timeout-minutes: 60

    env:
      SCHEME: QoQ-Direct
      PROJECT: qoq.xcodeproj
      TEAM_ID: 4SGGP72YQZ
      TAP_REPOSITORY: chensiyue98/homebrew-tap
      TAP_NAME: chensiyue98/tap

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid build number: $BUILD_NUMBER"
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Releases must be created from main"
            exit 1
          fi

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Create temporary keychain
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/qoq-signing.keychain-db"

          printf '%s' "$CERTIFICATE_BASE64" |
            base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/QoQ.xcarchive"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            ENABLE_HARDENED_RUNTIME=YES \
            ONLY_ACTIVE_ARCH=NO

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export Developer ID app
        shell: bash
        run: |
          set -euo pipefail

          EXPORT_PATH="$RUNNER_TEMP/export"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist \
              "Config/ExportOptions-DeveloperID.plist"

          test -d "$EXPORT_PATH/QoQ.app"

          echo "APP_PATH=$EXPORT_PATH/QoQ.app" >> "$GITHUB_ENV"

      - name: Verify code signature
        shell: bash
        run: |
          set -euo pipefail

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP_PATH"

          codesign \
            --display \
            --verbose=4 \
            "$APP_PATH"

      - name: Prepare notarization credentials
        shell: bash
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          printf '%s' "$ASC_PRIVATE_KEY_BASE64" |
            base64 --decode > "$ASC_KEY_PATH"

          chmod 600 "$ASC_KEY_PATH"

          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Submit app for notarization
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          NOTARY_ZIP="$RUNNER_TEMP/QoQ-notarization.zip"

          ditto \
            -c \
            -k \
            --keepParent \
            "$APP_PATH" \
            "$NOTARY_ZIP"

          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait

      - name: Staple and validate notarization
        shell: bash
        run: |
          set -euo pipefail

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP_PATH"

          spctl \
            --assess \
            --type execute \
            --verbose=4 \
            "$APP_PATH"

      - name: Create final archive
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          ASSET_NAME="QoQ-$VERSION.zip"
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$ASSET_PATH"

          shasum -a 256 "$ASSET_PATH" > "$ASSET_PATH.sha256"

          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"

      - name: Create and push tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            -a "v$VERSION" \
            "$GITHUB_SHA" \
            -m "QoQ $VERSION"

          git push origin "v$VERSION"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          RELEASE_ARGS=(
            "v$VERSION"
            "$ASSET_PATH"
            "$ASSET_PATH.sha256"
            --verify-tag
            --generate-notes
            --title "QoQ $VERSION"
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "${RELEASE_ARGS[@]}"

      - name: Calculate Homebrew Cask checksum
        if: ${{ inputs.prerelease == false }}
        id: homebrew
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          SHA256="$(shasum -a 256 "$ASSET_PATH" | awk '{print $1}')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew Tap
        if: ${{ inputs.prerelease == false }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew Cask
        if: ${{ inputs.prerelease == false }}
        shell: bash
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.homebrew.outputs.version }}
          SHA256: ${{ steps.homebrew.outputs.sha256 }}
        run: |
          set -euo pipefail

          CASK_PATH="Casks/qoq.rb"
          test -f "$CASK_PATH"

          perl -0pi -e \
            's/version "[^"]+"/version "$ENV{VERSION}"/; s/sha256 "[^"]+"/sha256 "$ENV{SHA256}"/' \
            "$CASK_PATH"

          grep -Fq "version \"$VERSION\"" "$CASK_PATH"
          grep -Fq "sha256 \"$SHA256\"" "$CASK_PATH"
          git diff --check
          git diff -- "$CASK_PATH"

      - name: Commit Homebrew Cask update
        if: ${{ inputs.prerelease == false }}
        shell: bash
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.homebrew.outputs.version }}
        run: |
          set -euo pipefail

          BRANCH="update-qoq-$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"
          git add Casks/qoq.rb
          git commit -m "Update QoQ to $VERSION"

      - name: Audit Homebrew Cask
        if: ${{ inputs.prerelease == false }}
        shell: bash
        run: |
          set -euo pipefail

          brew untap "$TAP_NAME" >/dev/null 2>&1 || true
          brew untrust --tap "$TAP_NAME" >/dev/null 2>&1 || true
          brew tap "$TAP_NAME" "$GITHUB_WORKSPACE/homebrew-tap"
          trap 'brew untrust --tap "$TAP_NAME" >/dev/null 2>&1 || true; brew untap "$TAP_NAME" >/dev/null 2>&1 || true' EXIT
          brew trust --tap "$TAP_NAME"

          brew audit --cask --strict qoq

      - name: Create Homebrew Cask update PR
        if: ${{ inputs.prerelease == false }}
        shell: bash
        working-directory: homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.homebrew.outputs.version }}
        run: |
          set -euo pipefail

          BRANCH="update-qoq-$VERSION"
          git push --set-upstream origin "$BRANCH"

          gh pr create \
            --repo "$TAP_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "Update QoQ to $VERSION" \
            --body "Updates the QoQ Cask to GitHub release v$VERSION."

      - name: Upload diagnostic artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: |
            ~/Library/Logs/DiagnosticReports
            ${{ runner.temp }}/*.xcdistributionlogs
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
