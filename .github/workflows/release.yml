name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.2.0"
        required: true
        type: string
      build_number:
        description: "Build number, for example 12"
        required: true
        type: string
      prerelease:
        description: "Create a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, notarize and release
    runs-on: macos-26
    environment: production
    timeout-minutes: 60

    env:
      SCHEME: qoq
      PROJECT: qoq.xcodeproj
      TEAM_ID: 4SGGP72YQZ

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid build number: $BUILD_NUMBER"
            exit 1
          fi

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "Releases must be created from main"
            exit 1
          fi

      - name: Select Xcode
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Create temporary keychain
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/qoq-signing.keychain-db"

          printf '%s' "$CERTIFICATE_BASE64" |
            base64 --decode > "$CERTIFICATE_PATH"

          security create-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security set-keychain-settings \
            -lut 21600 \
            "$KEYCHAIN_PATH"

          security unlock-keychain \
            -p "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains \
            -d user \
            -s "$KEYCHAIN_PATH"

          security find-identity \
            -v \
            -p codesigning \
            "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail

          ARCHIVE_PATH="$RUNNER_TEMP/QoQ.xcarchive"

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            ENABLE_HARDENED_RUNTIME=YES \
            ONLY_ACTIVE_ARCH=NO

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export Developer ID app
        shell: bash
        run: |
          set -euo pipefail

          EXPORT_PATH="$RUNNER_TEMP/export"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist \
              "Config/ExportOptions-DeveloperID.plist"

          test -d "$EXPORT_PATH/QoQ.app"

          echo "APP_PATH=$EXPORT_PATH/QoQ.app" >> "$GITHUB_ENV"

      - name: Verify code signature
        shell: bash
        run: |
          set -euo pipefail

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP_PATH"

          codesign \
            --display \
            --verbose=4 \
            "$APP_PATH"

      - name: Prepare notarization credentials
        shell: bash
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"

          printf '%s' "$ASC_PRIVATE_KEY_BASE64" |
            base64 --decode > "$ASC_KEY_PATH"

          chmod 600 "$ASC_KEY_PATH"

          echo "ASC_KEY_PATH=$ASC_KEY_PATH" >> "$GITHUB_ENV"

      - name: Submit app for notarization
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          NOTARY_ZIP="$RUNNER_TEMP/QoQ-notarization.zip"

          ditto \
            -c \
            -k \
            --keepParent \
            "$APP_PATH" \
            "$NOTARY_ZIP"

          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait

      - name: Staple and validate notarization
        shell: bash
        run: |
          set -euo pipefail

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

          codesign \
            --verify \
            --deep \
            --strict \
            --verbose=2 \
            "$APP_PATH"

          spctl \
            --assess \
            --type execute \
            --verbose=4 \
            "$APP_PATH"

      - name: Create final archive
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          ASSET_NAME="QoQ-$VERSION.zip"
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "$ASSET_PATH"

          shasum -a 256 "$ASSET_PATH" > "$ASSET_PATH.sha256"

          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          echo "ASSET_PATH=$ASSET_PATH" >> "$GITHUB_ENV"

      - name: Create and push tag
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            -a "v$VERSION" \
            "$GITHUB_SHA" \
            -m "QoQ $VERSION"

          git push origin "v$VERSION"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail

          RELEASE_ARGS=(
            "v$VERSION"
            "$ASSET_PATH"
            "$ASSET_PATH.sha256"
            --verify-tag
            --generate-notes
            --title "QoQ $VERSION"
          )

          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "${RELEASE_ARGS[@]}"

      - name: Upload diagnostic artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-diagnostics
          path: |
            ~/Library/Logs/DiagnosticReports
            ${{ runner.temp }}/*.xcdistributionlogs
          if-no-files-found: ignore
          retention-days: 7

      - name: Delete temporary keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi